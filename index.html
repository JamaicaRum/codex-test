<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Инна Матиссон — Психолог</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0B0B0C',
              accent: '#E52727',
              charcoal: '#1A1A1A',
              paper: '#FFFFFF'
            },
            fontFamily: {
              display: ['Sora', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
              ui: ['Manrope', 'sans-serif']
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@19/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
    <style>
      body { margin: 0; background:#fff; color:#1A1A1A; }
      .split { display:flex; min-height: 430px; border-top:1px solid #e7e7e7; border-bottom:1px solid #e7e7e7; }
      .panel { flex:1; transition: flex .45s ease; position:relative; overflow:hidden; }
      .split:hover .panel { flex: .8; }
      .split .panel:hover { flex: 1.2; }
      .panel-bg { position:absolute; inset:0; background-size:cover; background-position:center; filter:grayscale(100%) contrast(90%); transform:scale(1.03); transition:filter .4s ease, transform .4s ease; }
      .panel:hover .panel-bg { filter:grayscale(15%) contrast(105%); transform:scale(1.07); }
      .panel-content { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:40px; color:#fff; background:linear-gradient(to top, rgba(11,11,12,.88), rgba(11,11,12,.35)); }
      .arrow { display:inline-block; transition: transform .3s ease; }
      .panel:hover .arrow { transform:translateX(5px); }
      .line-link { position:relative; display:inline-block; }
      .line-link::after { content:""; position:absolute; left:0; bottom:-3px; width:100%; height:2px; background:#E52727; transform:scaleX(0); transform-origin:left; transition:transform .25s ease; }
      .line-link:hover::after { transform:scaleX(1); }
      .video-tile img { transition: transform .4s ease; }
      .video-tile:hover img { transform:scale(1.06); }
      .video-tile:hover .play { opacity:1; transform:translate(-50%,-50%) scale(1); }
      .play { opacity:0; transform:translate(-50%,-50%) scale(.8); transition:all .3s ease; }
      @media (max-width: 1024px){ .split { flex-direction:column; min-height: initial; } .split .panel, .split:hover .panel, .split .panel:hover { flex: initial; min-height:320px; } }
    </style>
  </head>
  <body class="font-body">
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useState } = React;

      function App(){
        const [scrolled, setScrolled] = useState(false);

        useEffect(() => {
          gsap.registerPlugin(ScrollTrigger);

          const onScroll = () => setScrolled(window.scrollY > 18);
          window.addEventListener('scroll', onScroll);
          onScroll();

          gsap.from('.hero-line', { y: 90, opacity: 0, duration: 0.9, stagger: 0.14, ease: 'power3.out', delay: 0.15 });
          gsap.from('.hero-sub', { y: 24, opacity: 0, duration: 0.8, ease: 'power2.out', delay: .55 });
          gsap.from('.hero-image', { opacity: 0, scale: 1.08, duration: 1.1, ease: 'power2.out', delay: .3 });

          document.querySelectorAll('.reveal').forEach((el) => {
            gsap.from(el, {
              y: 42,
              opacity: 0,
              duration: 0.9,
              ease: 'power2.out',
              scrollTrigger: { trigger: el, start: 'top 84%' }
            });
          });

          return () => window.removeEventListener('scroll', onScroll);
        }, []);

        return (
          <>
            <header className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white border-b border-neutral-200' : 'bg-transparent border-b border-transparent'}`}>
              <div className="max-w-[1280px] mx-auto px-6 md:px-10 h-[78px] flex items-center justify-between">
                <a href="#" className="font-ui text-xs tracking-[0.16em] font-bold text-primary">ИННА МАТИССОН</a>
                <nav className="hidden md:flex items-center gap-10 font-ui text-[11px] tracking-[0.14em] font-bold text-primary">
                  <a href="#approach" className="line-link">О ПОДХОДЕ</a>
                  <a href="#materials" className="line-link">МАТЕРИАЛЫ</a>
                  <a href="#events" className="line-link">МЕРОПРИЯТИЯ</a>
                </nav>
              </div>
            </header>

            <main>
              <section className="min-h-screen flex items-center pt-24">
                <div className="max-w-[1280px] mx-auto px-6 md:px-10 w-full grid grid-cols-12 gap-6 items-center">
                  <div className="col-span-12 lg:col-span-7">
                    <h1 className="font-display text-primary text-[clamp(2.2rem,5.4vw,5.2rem)] leading-[0.96] tracking-[-0.03em]">
                      <span className="hero-line block">Кризисы в отношениях после 35 —</span>
                      <span className="hero-line block">это не про характер и не про чувства.</span>
                      <span className="hero-line block">Это следствие сломанной системы ролей.</span>
                    </h1>
                    <p className="hero-sub mt-8 max-w-[52ch] text-[clamp(1rem,1.35vw,1.2rem)] leading-relaxed">
                      Инна Матиссон<br/>Психолог. Работает с кризисами мужской и женской роли в зрелых отношениях.
                    </p>
                  </div>
                  <div className="col-span-12 lg:col-span-5 hero-image">
                    <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=1100&q=80" alt="Портрет Инны Матиссон" className="w-full aspect-[4/5] object-cover"/>
                  </div>
                </div>
              </section>

              <section className="reveal">
                <div className="split">
                  <article className="panel">
                    <div className="panel-bg" style={{backgroundImage:'url(https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1400&q=80)'}}></div>
                    <div className="panel-content">
                      <div>
                        <h2 className="font-display text-4xl mb-4">Мужчинам</h2>
                        <p className="max-w-[40ch] text-white/85 text-lg">Ты состоялся в жизни: ответственность, решения, деньги. Но в отношениях тебя перестали уважать.</p>
                      </div>
                      <a href="#materials" className="inline-flex items-center gap-2 w-fit bg-accent text-white font-ui text-xs tracking-[0.12em] px-5 py-3">ПЕРЕЙТИ <span className="arrow">→</span></a>
                    </div>
                  </article>
                  <article className="panel">
                    <div className="panel-bg" style={{backgroundImage:'url(https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1400&q=80)'}}></div>
                    <div className="panel-content">
                      <div>
                        <h2 className="font-display text-4xl mb-4">Женщинам</h2>
                        <p className="max-w-[40ch] text-white/85 text-lg">Ты сильная и самостоятельная. Но рядом либо слабый мужчина, либо постоянное напряжение и борьба.</p>
                      </div>
                      <a href="#materials" className="inline-flex items-center gap-2 w-fit bg-accent text-white font-ui text-xs tracking-[0.12em] px-5 py-3">ПЕРЕЙТИ <span className="arrow">→</span></a>
                    </div>
                  </article>
                </div>
              </section>

              <section id="approach" className="reveal max-w-[1100px] mx-auto px-6 md:px-10 py-28">
                <h2 className="font-display text-5xl mb-12 text-primary">Подход</h2>
                {[
                  'Отношения — это система, а не эмоции',
                  'Роль и поведение важнее намерений',
                  'Советы не работают без смены конструкции',
                  'Здесь не ищут виноватых — разбирают устройство',
                  'Чувства важны, но они не чинят сломанные роли'
                ].map((item, i) => (
                  <div key={item} className="grid grid-cols-[60px_1fr] md:grid-cols-[90px_1fr] py-7 border-b border-neutral-200 items-start">
                    <span className="font-ui font-bold tracking-[0.12em] text-accent">{String(i+1).padStart(2,'0')}</span>
                    <h3 className="font-display text-2xl md:text-4xl leading-tight">{item}</h3>
                  </div>
                ))}
              </section>

              <section className="reveal max-w-[1280px] mx-auto px-6 md:px-10 py-20 grid grid-cols-12 gap-8 items-start">
                <div className="col-span-12 lg:col-span-5">
                  <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=1000&q=80" alt="Инна Матиссон" className="w-full aspect-[4/5] object-cover"/>
                </div>
                <div className="col-span-12 lg:col-span-7">
                  <h2 className="font-display text-5xl mb-7">Об авторе</h2>
                  <p className="text-xl leading-relaxed max-w-[48ch]">Инна Матиссон — практикующий психолог с аналитическим подходом к отношениям.</p>
                  <div className="mt-10 grid md:grid-cols-2 gap-10">
                    <div>
                      <h3 className="font-ui text-sm tracking-[0.14em] font-bold mb-4">РАБОТАЕТ С КОНКРЕТНЫМИ СИТУАЦИЯМИ</h3>
                      <ul className="space-y-2 text-lg">
                        <li>— Кризисы брака</li><li>— Потеря роли</li><li>— Проблемы границ</li>
                      </ul>
                    </div>
                    <div>
                      <h3 className="font-ui text-sm tracking-[0.14em] font-bold mb-4">БЭКГРАУНД</h3>
                      <ul className="space-y-2 text-lg">
                        <li>— Опыт юриста и следователя</li><li>— Фокус на причинах</li>
                      </ul>
                    </div>
                  </div>
                </div>
              </section>

              <section id="materials" className="reveal max-w-[1280px] mx-auto px-6 md:px-10 py-20">
                <h2 className="font-display text-5xl mb-10">Статьи</h2>
                <div className="grid md:grid-cols-3 gap-8">
                  {['Женщина на продажу: цена и ценность','Как женщины на самом деле видят мужчину','Замужняя любовница: практическая инструкция'].map((t, i)=>(
                    <article key={t} className="border-t border-primary pt-5 group">
                      <div className="font-ui text-xs tracking-[0.12em] text-accent mb-4">{String(i+1).padStart(2,'0')}</div>
                      <h3 className="font-display text-2xl leading-tight line-link inline">{t}</h3>
                    </article>
                  ))}
                </div>
              </section>

              <section className="reveal max-w-[1280px] mx-auto px-6 md:px-10 py-16">
                <h2 className="font-display text-5xl mb-10">Видео</h2>
                <div className="grid md:grid-cols-3 gap-8">
                  {['Женское уважение к мужчине: откуда оно берётся','Почему «хороший мужчина» перестаёт быть мужчиной','Женский ТОП-клуб: как и зачем он работает'].map((t, i)=>(
                    <article key={t} className="video-tile">
                      <div className="relative overflow-hidden mb-4">
                        <img src={`https://picsum.photos/seed/inna-video-${i+1}/600/360`} alt="Видео превью" className="w-full aspect-video object-cover"/>
                        <div className="play absolute left-1/2 top-1/2 text-white text-4xl">▶</div>
                      </div>
                      <div className="font-ui text-xs tracking-[0.12em] text-accent mb-2">{String(i+1).padStart(2,'0')}</div>
                      <h3 className="font-display text-2xl leading-tight">{t}</h3>
                    </article>
                  ))}
                </div>
              </section>

              <section id="events" className="reveal max-w-[1100px] mx-auto px-6 md:px-10 py-24">
                <h2 className="font-display text-5xl mb-10">Мероприятия</h2>
                <div className="border-l border-neutral-300 ml-6">
                  {[
                    ['Прошло', 'Офлайн-семинар Инны Матиссон — Москва'],
                    ['Прошло', 'Выезд ТОП-клуба — Казань'],
                    ['Анонс', 'Закрытая встреча участников — Санкт-Петербург']
                  ].map(([status, title]) => (
                    <div key={title} className="grid md:grid-cols-[130px_1fr] gap-6 py-6 pl-6 border-b border-neutral-200">
                      <span className={`font-ui text-xs tracking-[0.12em] ${status === 'Анонс' ? 'text-accent' : 'text-primary'}`}>{status.toUpperCase()}</span>
                      <p className="font-display text-2xl leading-tight">{title}</p>
                    </div>
                  ))}
                </div>
              </section>
            </main>

            <footer className="border-t border-neutral-200 py-14">
              <div className="max-w-[1280px] mx-auto px-6 md:px-10">
                <h2 className="font-display text-3xl mb-6">Инна Матиссон в социальных сетях</h2>
                <div className="flex flex-wrap gap-x-7 gap-y-3 font-ui text-sm tracking-[0.08em] mb-8">
                  {['Telegram','YouTube','VK','Дзен','Rutube','TikTok','vc.ru'].map((n)=><a key={n} href="#" className="line-link">{n}</a>)}
                </div>
                <a href="mailto:email@email.com" className="text-lg">email@email.com</a>
                <p className="mt-8 text-sm text-neutral-500">© 2026 Инна Матиссон</p>
              </div>
            </footer>
          </>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
